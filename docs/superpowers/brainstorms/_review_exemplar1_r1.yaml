- severity: NIT
  location: "Task 1 (and general task structure)"
  problem: "The sample treats the test script as a standalone deliverable committed before implementation tasks begin; the draft bundles test creation and implementation into single tasks."
  evidence: "Sample `2026-04-06-worktree-rototill.md` §Task 1 creates, validates, and commits the test script as an independent deliverable before §Task 2-3 rewrite the skill files; draft §Task 2 Step 1 creates the test, Step 3 implements the code, and Step 5 commits both together — test and implementation share a task boundary."
  suggestion: "Consider splitting the first TDD task per phase into two: a validation task that commits the test infrastructure alone, followed by implementation tasks that use those tests."

findings:

- severity: BLOCKING
  location: "Task 6: BasePlugin ABC — MCPResource dataclass and register_mcp_resources() abstract method"
  problem: "MCPResource dataclass and register_mcp_resources() abstract method are in the BasePlugin interface but have zero consumers."
  evidence: |
    What it is: A `MCPResource` dataclass (with uri/name/description/schema) and a corresponding
    `register_mcp_resources()` abstract method on BasePlugin. Every plugin subclass must implement it.
    What goal it claims to serve: "Plugin System (Python ABC + MCP Server dual-mode)" — the ABC side
    provides an MCP resource registration path.
    Why that goal doesn't require it: (a) No plugin test or fake plugin in the plan returns anything
    from register_mcp_resources() except []. (b) The MCPServer in Task 23 has its own completely
    independent tool registration (register_tool / list_tools) that never reads from BasePlugin's
    MCPResource. (c) The two registration systems are not connected anywhere. The MCPResource path
    is pure interface surface with no implementation or consumer across all 25 tasks.
  suggestion: "Remove `MCPResource` dataclass and `register_mcp_resources()` abstract method from BasePlugin. Defer to a future spec when the MCP dual-mode wiring is actually designed and has a concrete consumer."
  reviewer_role: yagni-gatekeeper

- severity: BLOCKING
  location: "Task 19: PlatformIntrospection ABC — forhacker/meta/introspection.py"
  problem: "PlatformIntrospection is an abstract base class with three abstract methods and zero concrete implementations anywhere in the entire 25-task plan."
  evidence: |
    What it is: An ABC with abstract methods `list_registered_plugins()`, `get_skill_configurations()`,
    and `get_recent_metrics()`. The plan creates a test proving it cannot be instantiated, implements
    the ABC skeleton, and commits it.
    What goal it claims to serve: "MetaAgent (four-role self-improvement)" — the Platform Optimizer
    role reads platform state to propose improvements.
    Why that goal doesn't require it: (a) The MetaAgent code in Task 18 (agent.py, evaluator.py,
    sources.py) never imports or references PlatformIntrospection. (b) No concrete subclass exists
    anywhere in the 25 tasks. (c) No code calls `list_registered_plugins()`, `get_skill_configurations()`,
    or `get_recent_metrics()`. (d) The design principle of "abstract interface with >=2 implementations"
    requires at least one concrete implementation to exist for the interface to be load-bearing; here
    there are zero. This is pure abstraction-before-need.
  suggestion: "Remove `forhacker/meta/introspection.py` and its test from the plan. Defer to a future spec when the Platform Optimizer role is being built and an actual concrete implementation exists."
  reviewer_role: yagni-gatekeeper


[project]
name = "forhacker"
version = "0.1.0"
description = "AI-Native Digital Forensics Platform"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "openai>=1.0",
    "anthropic>=0.30",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "jinja2>=3.0",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
forhacker = "forhacker.cli.main:cli"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["UP017"]  # datetime.UTC requires Python 3.11+

[tool.ruff.lint.per-file-ignores]
"forhacker/llm/*.py" = ["E501"]  # inherited long function signatures
"forhacker/cli/web/app.py" = ["E501"]  # inline HTML/CSS
"forhacker/meta/sources.py" = ["E501"]  # long URLs
"tests/test_plugin/test_marketplace.py" = ["E501"]  # long register call

[tool.setuptools.packages.find]
include = ["forhacker*"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

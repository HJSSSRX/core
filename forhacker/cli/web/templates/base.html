<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForHacker Dashboard</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --accent: #58a6ff; --green: #3fb950; --red: #f85149; --yellow: #d29922; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .header { border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem; }
        .header h1 { color: var(--accent); font-size: 1.25rem; }
        .header nav a { color: var(--text); text-decoration: none; padding: 0.25rem 0.75rem; border-radius: 6px; font-size: 0.875rem; }
        .header nav a:hover { background: var(--card); }
        .container { max-width: 1100px; margin: 0 auto; padding: 2rem; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; }
        .card h2 { font-size: 1rem; margin-bottom: 0.75rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
        .stat { font-size: 2rem; font-weight: 700; }
        .stat.green { color: var(--green); }
        .stat.red { color: var(--red); }
        .stat.yellow { color: var(--yellow); }
        .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
        .badge.done { background: #1a3a2a; color: var(--green); }
        .badge.running { background: #3a2a1a; color: var(--yellow); }
        .badge.failed { background: #3a1a1a; color: var(--red); }
        .badge.pending { background: #1a1a2a; color: #8b949e; }
        .finding { border-left: 3px solid var(--border); padding: 0.5rem 0.75rem; margin: 0.5rem 0; }
        .finding pre { font-size: 0.8rem; overflow-x: auto; white-space: pre-wrap; }
        .empty { color: #8b949e; text-align: center; padding: 3rem; }
        code { background: #1a1a2a; padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.85rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); font-size: 0.875rem; }
        th { color: #8b949e; font-weight: 500; }
    </style>
</head>
<body>
    <div class="header">
        <h1>ForHacker Dashboard</h1>
        <nav>
            <a href="/">Cases</a>
        </nav>
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
